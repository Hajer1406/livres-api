name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests unitaires & vérification du projet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']
      fail-fast: false
    steps:
      - name: Récupérer le code (checkout)
        uses: actions/checkout@v4

      - name: Configurer l'environnement Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Rendre les scripts exécutables
        run: |
          chmod +x ./mvnw
          chmod +x ./scripts/*.sh

      - name: Contrôles de conformité du projet
        run: ./scripts/check-project.sh

      - name: Exécuter la suite de tests
        run: ./mvnw test -q

      - name: Conserver le rapport de tests en artefact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-java-${{ matrix.java-version }}
          path: target/surefire-reports/*.xml

  docker-build:
    name: Construction et publication de l'image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (checkout)
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR (si publication)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déterminer les tags de l'image
        id: meta
        run: |
          # Convertir le repository en minuscules pour GHCR
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "push=true" >> $GITHUB_OUTPUT
            echo "tags=ghcr.io/${REPO_LC}:${{ github.ref_name }},ghcr.io/${REPO_LC}:latest" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
            echo "tags=livres-api:ci" >> $GITHUB_OUTPUT
          fi

      - name: Construire l'image Docker (et publier si tag de version)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
