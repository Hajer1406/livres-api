spring.application.name=livres-api
server.port=${PORT:8080}
server.servlet.context-path=/

# Base de données paramétrée par variables d'environnement (avec valeurs par défaut)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:livres_DB}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:campus}
spring.datasource.password=${DB_PASSWORD:dev-password}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
